[project]
name = "hhparser"
version = "0.1.0"
description = "HH.ru parser library"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.14,<5",
    "requests>=2.34,<3",
    "fake-headers>=1.0,<2",
    "price-parser>=0.5,<1",
    "inflection>=0.5,<1",
    "html2text>=2025.4",
    "aiohttp>=3.13,<4",
    "proxybroker2 @ git+https://github.com/bluet/proxybroker2.git@v2.0.0b1",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["hhparser", "example.py", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line length — handled by formatter
]

[tool.ruff.format]
quote-style = "double"
